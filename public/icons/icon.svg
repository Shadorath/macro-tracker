<!-- App icon (Cyberpunk): a 70 % calorie ring and the three macro bars
     (protein, carbs, fat), as on the Today screen. Full-bleed square so
     Android can cut it into its round shape; everything important stays
     inside the middle 80 % (the "safe zone").
     PNGs are made from this file by scripts/make-icons.ps1. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#0A0614"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#2A1A45" stroke-width="40"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#FF2A6D" stroke-width="40" stroke-linecap="round"
    stroke-dasharray="660 400" transform="rotate(-90 256 256)" filter="url(#glow)"/>
  <g stroke-width="20" stroke-linecap="round">
    <path d="M202 220 h108" stroke="#B967FF"/>
    <path d="M202 256 h80" stroke="#F9F002"/>
    <path d="M202 292 h56" stroke="#05D9E8"/>
  </g>
</svg>
